  @if (prospectivityMapDataResource.isLoading()) {
    <div class="flex h-full items-center justify-center">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  }

  @if (prospectivityMapDataResource.error()) {
    <div class="flex h-full items-center justify-center">
      <div class="alert alert-error max-w-md">
        <span>Could not load prospectivity map.</span>
      </div>
    </div>
  }

  @if (prospectivityMapDataResource.value(); as data) {
    <app-map class="block h-full" [data]="data" />
  }
